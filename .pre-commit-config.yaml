repos:
-   repo: local
    hooks:
    -   id: jupyter-book-build
        name: Build Jupyter Book HTML
        entry: jupyter-book build .
        language: system
        pass_filenames: false
        files: ^(lessons/|intro\.md|myst\.yml)
        types_or: [markdown, jupyter]
        description: "Automatically builds the Jupyter Book HTML whenever documentation files are modified."
