[project]
name = "mlflow-tutorial-book"
version = "0.1.0"
description = "A comprehensive Jupyter Book tutorial for MLflow, covering foundations, intermediate, advanced, and mastery levels."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "MLflow Enthusiast", email = "enthusiast@example.com" }
]
license = { text = "MIT" }
keywords = ["mlflow", "mlops", "jupyter-book", "tutorial"]
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter-book>=2.1.4",
    "ghp-import"
]

[project.urls]
Repository = "https://github.com/somnathrakshit/mlflow"
Documentation = "https://somnathrakshit.github.io/mlflow"